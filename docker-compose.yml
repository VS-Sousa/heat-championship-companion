# Local stack for storageMode=local. Not used by GitHub Pages (SPA-only deploy).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat
      POSTGRES_DB: heat
    ports:
      - '5432:5432'
    volumes:
      - heat_pg_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build: ./server
    depends_on: [db]
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://heat:heat@db:5432/heat
      PORT: '3000'
      CORS_ORIGIN: '*'

volumes:
  heat_pg_data:
