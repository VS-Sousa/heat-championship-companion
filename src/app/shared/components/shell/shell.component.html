<div class="min-h-screen w-full min-w-0 overflow-x-clip bg-heat-bg bg-speed-lines">
  <header
    class="border-b bg-heat-surface/95 backdrop-blur"
    style="border-color: var(--heat-border)"
  >
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-1.5 px-3 py-3 sm:gap-4 sm:px-4">
      <a routerLink="/dashboard" class="group flex min-w-0 items-center gap-2 sm:gap-3">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-sm bg-heat-red font-display text-xl text-white sm:h-10 sm:w-10 sm:text-2xl"
        >
          H
        </span>
        <div class="min-w-0">
          <p class="font-display text-xl leading-none tracking-[0.14em] text-heat-red sm:text-2xl sm:tracking-[0.18em]">
            {{ 'brand.name' | t }}
          </p>
          <p class="hidden text-[11px] uppercase tracking-[0.28em] text-heat-yellow sm:block">
            {{ 'brand.tagline' | t }}
          </p>
        </div>
      </a>

      <nav class="hidden items-center gap-1 md:flex">
        @for (link of visibleLinks(); track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-heat-yellow/15 text-heat-yellow"
            class="rounded-sm p-2.5 text-heat-muted transition hover:text-heat-ink"
            [attr.title]="link.labelKey | t"
            [attr.aria-label]="link.labelKey | t"
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @switch (link.icon) {
                @case ('dashboard') {
                  <rect x="3" y="3" width="7" height="9" />
                  <rect x="14" y="3" width="7" height="5" />
                  <rect x="14" y="12" width="7" height="9" />
                  <rect x="3" y="16" width="7" height="5" />
                }
                @case ('championships') {
                  <path d="M8 21h8" />
                  <path d="M12 17v4" />
                  <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
                  <path d="M17 6h2a2 2 0 0 1 0 4h-2" />
                  <path d="M7 6H5a2 2 0 0 0 0 4h2" />
                }
                @case ('drivers') {
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" />
                }
                @case ('cars') {
                  <path d="M3 14h18" />
                  <path d="M5 14l1.5-5a2 2 0 0 1 1.9-1.4h7.2a2 2 0 0 1 1.9 1.4L19 14" />
                  <circle cx="7.5" cy="16.5" r="1.5" />
                  <circle cx="16.5" cy="16.5" r="1.5" />
                  <path d="M7 9h10" />
                }
                @case ('tracks') {
                  <path d="M4 15c2-1 4-1 6 0s4 1 6 0 4-1 6 0" />
                  <path d="M4 19c2-1 4-1 6 0s4 1 6 0 4-1 6 0" />
                  <path d="M14 4l6 3-6 3V4Z" />
                  <path d="M14 4v11" />
                }
                @case ('logRace') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                }
              }
            </svg>
          </a>
        }
      </nav>

      <div class="flex shrink-0 items-center gap-1.5 sm:gap-3">
        <app-prefs-bar />
        <div class="hidden text-right md:block">
          <p class="font-mono text-xs uppercase tracking-widest text-heat-yellow">
            {{ roleLabel() }}
          </p>
          <p class="text-sm text-heat-ink">{{ displayName() }}</p>
        </div>
        <button
          type="button"
          class="heat-btn-ghost p-2"
          (click)="disconnect()"
          [attr.title]="'nav.disconnect' | t"
          [attr.aria-label]="'nav.disconnect' | t"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
        <button
          type="button"
          class="heat-btn-secondary p-2 md:hidden"
          (click)="menuOpen = !menuOpen"
          [attr.aria-expanded]="menuOpen"
          [attr.title]="'nav.menu' | t"
          [attr.aria-label]="'nav.menu' | t"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16" />
            <path d="M4 12h16" />
            <path d="M4 17h16" />
          </svg>
        </button>
      </div>
    </div>

    <div
      class="border-t px-4 py-2 md:hidden"
      style="border-color: var(--heat-border)"
      [ngClass]="{ hidden: !menuOpen }"
    >
      <div class="flex flex-col gap-1">
        @for (link of visibleLinks(); track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-heat-yellow"
            class="flex items-center gap-3 rounded-sm px-2 py-2 text-heat-muted"
            (click)="menuOpen = false"
          >
            <svg
              class="h-5 w-5 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @switch (link.icon) {
                @case ('dashboard') {
                  <rect x="3" y="3" width="7" height="9" />
                  <rect x="14" y="3" width="7" height="5" />
                  <rect x="14" y="12" width="7" height="9" />
                  <rect x="3" y="16" width="7" height="5" />
                }
                @case ('championships') {
                  <path d="M8 21h8" />
                  <path d="M12 17v4" />
                  <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
                  <path d="M17 6h2a2 2 0 0 1 0 4h-2" />
                  <path d="M7 6H5a2 2 0 0 0 0 4h2" />
                }
                @case ('drivers') {
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" />
                }
                @case ('cars') {
                  <path d="M3 14h18" />
                  <path d="M5 14l1.5-5a2 2 0 0 1 1.9-1.4h7.2a2 2 0 0 1 1.9 1.4L19 14" />
                  <circle cx="7.5" cy="16.5" r="1.5" />
                  <circle cx="16.5" cy="16.5" r="1.5" />
                  <path d="M7 9h10" />
                }
                @case ('tracks') {
                  <path d="M4 15c2-1 4-1 6 0s4 1 6 0 4-1 6 0" />
                  <path d="M4 19c2-1 4-1 6 0s4 1 6 0 4-1 6 0" />
                  <path d="M14 4l6 3-6 3V4Z" />
                  <path d="M14 4v11" />
                }
                @case ('logRace') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                }
              }
            </svg>
            <span class="uppercase tracking-[0.16em]">{{ link.labelKey | t }}</span>
          </a>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto w-full min-w-0 max-w-6xl px-3 py-5 sm:px-4 sm:py-8">
    <router-outlet />
  </main>
</div>
