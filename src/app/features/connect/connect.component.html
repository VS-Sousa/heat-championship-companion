<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
  <div class="pointer-events-none absolute inset-0 bg-checkered opacity-[0.07]"></div>
  <div
    class="pointer-events-none absolute -left-24 top-10 h-72 w-72 rounded-full bg-heat-red/20 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -right-16 bottom-0 h-80 w-80 rounded-full bg-heat-yellow/10 blur-3xl"
  ></div>

  <div class="absolute right-4 top-4 z-20 sm:right-6 sm:top-6">
    <app-prefs-bar />
  </div>

  <section class="heat-tape relative z-10 w-full max-w-xl p-6 sm:p-8">
    <div class="mb-6 flex items-start justify-between gap-3">
      <div>
        <p class="heat-subtitle mb-2">{{ 'connect.eyebrow' | t }}</p>
        <h1 class="heat-title mb-2 text-heat-red">{{ 'connect.title' | t }}</h1>
        <p class="max-w-md text-heat-muted">{{ 'connect.lead' | t }}</p>
      </div>
      <a routerLink="/" class="heat-btn-ghost shrink-0 text-sm">
        {{ 'nav.backHome' | t }}
      </a>
    </div>

    <div class="mb-6 grid grid-cols-2 gap-2">
      <button
        type="button"
        class="rounded-sm border px-3 py-2 uppercase tracking-[0.16em] transition"
        [ngClass]="
          mode === 'guest'
            ? 'border-heat-yellow bg-heat-yellow/15 text-heat-yellow'
            : 'text-heat-muted'
        "
        [style.border-color]="mode === 'guest' ? undefined : 'var(--heat-border)'"
        (click)="mode = 'guest'"
      >
        {{ 'connect.guest' | t }}
      </button>
      <button
        type="button"
        class="rounded-sm border px-3 py-2 uppercase tracking-[0.16em] transition"
        [ngClass]="
          mode === 'host'
            ? 'border-heat-yellow bg-heat-yellow/15 text-heat-yellow'
            : 'text-heat-muted'
        "
        [style.border-color]="mode === 'host' ? undefined : 'var(--heat-border)'"
        (click)="mode = 'host'"
      >
        {{ 'connect.host' | t }}
      </button>
    </div>

    <form class="space-y-4" (ngSubmit)="submit()">
      <div>
        <label class="heat-label" for="url">{{ 'connect.url' | t }}</label>
        <input
          id="url"
          class="heat-input font-mono text-sm"
          name="url"
          [(ngModel)]="url"
          placeholder="https://xxxx.supabase.co"
          autocomplete="off"
        />
      </div>

      <div>
        <label class="heat-label" for="publishableKey">
          {{ 'connect.publishableKey' | t }}
        </label>
        <input
          id="publishableKey"
          class="heat-input font-mono text-sm"
          name="publishableKey"
          [(ngModel)]="publishableKey"
          placeholder="sb_publishable_..."
          autocomplete="off"
        />
        <p class="mt-1 text-[11px] leading-snug text-heat-muted">
          {{ 'connect.publishableHint' | t }}
        </p>
      </div>

      @if (mode === 'host') {
        <div>
          <label class="heat-label" for="email">{{ 'connect.email' | t }}</label>
          <input
            id="email"
            class="heat-input"
            name="email"
            type="email"
            [(ngModel)]="email"
            autocomplete="username"
          />
        </div>
        <div>
          <label class="heat-label" for="password">{{ 'connect.password' | t }}</label>
          <input
            id="password"
            class="heat-input"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
          />
        </div>
      }

      @if (error()) {
        <div
          class="rounded-sm border border-heat-red/50 bg-heat-red/10 px-3 py-2 text-sm text-heat-ink"
          role="alert"
        >
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="heat-btn-primary w-full"
        [disabled]="loading()"
      >
        @if (loading()) {
          {{ 'connect.connecting' | t }}
        } @else if (mode === 'guest') {
          {{ 'connect.submitGuest' | t }}
        } @else {
          {{ 'connect.submitHost' | t }}
        }
      </button>
    </form>

    <p class="mt-6 text-xs uppercase tracking-[0.18em] text-heat-muted/80">
      {{ 'connect.sessionNote' | t }}
    </p>
  </section>
</div>
